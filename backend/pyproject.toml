[project]
name = "parkflow-backend"
version = "1.0.0"
description = "ParkFlow — laboratório de testes com IA"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]
markers = [
    "requisito(*ids): rastreabilidade — IDs das regras de negócio cobertas (ex.: R01).",
    "integracao: teste com banco de dados temporário.",
    "api: teste via HTTP (TestClient).",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]
